# Reverse proxy del Pronunciation Trainer con TLS terminado aqui (ECS).
# 80 -> redireccion a HTTPS. 443 -> proxy al contenedor 'trainer' (3000).
# El upstream se resuelve en RUNTIME via el DNS interno de Docker (127.0.0.11).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # El audio se manda como JSON base64: subir el limite del body.
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $trainer trainer;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;

    # La inferencia de Whisper puede tardar: timeouts holgados.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://$trainer:3000$request_uri;
    }
}
