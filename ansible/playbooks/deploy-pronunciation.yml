---
# ============================================================================
#  deploy-pronunciation.yml  --  Despliega el AI Pronunciation Trainer (GPU)
#
#  Cambios de este modelo:
#   - SIN bastion: el ECS tiene EIP directa; Ansible llega por SSH directo.
#   - HTTPS lo termina nginx EN EL PROPIO ECS (cert self-signed via openssl).
#   - El CSV de palabras vive en OBS. El contenedor lo descarga al ARRANCAR
#     via la IAM Agency del ECS (credenciales temporales). Reiniciar el ECS
#     (o el contenedor) re-descarga la ultima version.
#
#  Valores (--extra-vars desde Jenkins):
#    app_public_ip   <- host del inventory + SAN del certificado
#    ssh_key         <- llave privada (SSH directo)
#    obs_bucket      <- output obs_data_bucket (bucket del CSV)
#    obs_csv_key     <- output obs_csv_key (key del objeto, default data_en.csv)
#    obs_region      <- region OBS (la-south-2)
#    app_env         <- PROJECT (namespace SWR)
#  Credenciales SWR (Jenkins withCredentials): SWR_USER / SWR_PASS.
# ============================================================================

- name: Desplegar AI Pronunciation Trainer (GPU)
  hosts: pronunciation
  become: true

  vars:
    install_dir: /opt/pronunciation
    certs_dir: /opt/pronunciation/nginx/certs
    timezone: "America/Lima"

    app_env: "pronunciation"

    # --- OBS (CSV de palabras) ---
    obs_region: "la-south-2"
    obs_bucket: ""
    obs_csv_key: "data_en.csv"

    # --- Registro de imagenes (SWR) ---
    swr_registry_host: swr.la-south-2.myhuaweicloud.com
    swr_namespace: "swr-{{ app_env }}"
    trainer_version: "1.0"

    # --- Credenciales SWR desde el entorno (Jenkins withCredentials) ---
    swr_user: "{{ lookup('env', 'SWR_USER') }}"
    swr_password: "{{ lookup('env', 'SWR_PASS') }}"

  tasks:

    - name: Validar variables criticas
      assert:
        that:
          - obs_bucket | length > 0
          - app_public_ip is defined and app_public_ip | length > 0
        fail_msg: "Faltan obs_bucket (output obs_data_bucket) y/o app_public_ip."

    # ----------------------------------------------------- Preparacion base
    - name: Esperar a que cloud-init termine
      command: cloud-init status --wait
      changed_when: false

    - name: Fijar zona horaria del host
      command: "timedatectl set-timezone {{ timezone }}"
      changed_when: false

    - name: Instalar prerrequisitos
      apt:
        update_cache: yes
        name:
          - ca-certificates
          - curl
          - gnupg
          - openssl
        state: present

    # ------------------------------------------------ Docker (repo oficial)
    - name: Crear directorio de keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Agregar GPG key de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Agregar repositorio de Docker
      apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Instalar Docker Engine + Compose plugin
      apt:
        update_cache: yes
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Habilitar y arrancar Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    # ------------------------------------------------------ GPU NVIDIA
    - name: Comprobar si la GPU NVIDIA esta disponible
      command: nvidia-smi
      register: nvidia_smi
      failed_when: false
      changed_when: false

    - name: Instalar driver NVIDIA (si no hay GPU disponible)
      when: nvidia_smi.rc != 0
      block:
        - name: Instalar ubuntu-drivers-common
          apt:
            update_cache: yes
            name: ubuntu-drivers-common
            state: present
        - name: Autoinstalar el driver recomendado
          command: ubuntu-drivers autoinstall
        - name: Reiniciar para cargar el driver
          reboot:
            reboot_timeout: 600
        - name: Verificar GPU tras el reinicio
          command: nvidia-smi
          changed_when: false

    - name: Agregar GPG key del NVIDIA Container Toolkit
      get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        mode: "0644"

    - name: Agregar repositorio del NVIDIA Container Toolkit
      apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
          https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
        filename: nvidia-container-toolkit
        state: present

    - name: Instalar NVIDIA Container Toolkit
      apt:
        update_cache: yes
        name: nvidia-container-toolkit
        state: present

    - name: Configurar el runtime de Docker para NVIDIA
      command: nvidia-ctk runtime configure --runtime=docker
      changed_when: true

    - name: Reiniciar Docker para tomar el runtime NVIDIA
      systemd:
        name: docker
        state: restarted

    - name: Smoke test de GPU dentro de un contenedor
      command: docker run --rm --gpus all nvidia/cuda:12.1.0-base-ubuntu22.04 nvidia-smi
      changed_when: false

    # ----------------------------------------------------------- Login SWR
    - name: Login en SWR
      command:
        cmd: "docker login {{ swr_registry_host }} -u {{ swr_user }} --password-stdin"
        stdin: "{{ swr_password }}"
      no_log: true

    # ----------------------------------------------------- Estructura local
    - name: Crear directorios de la app
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ install_dir }}"
        - "{{ install_dir }}/nginx"
        - "{{ certs_dir }}"

    # --------------------------------------- Certificado self-signed (HTTPS)
    #  Idempotente: solo lo genera si no existe. SAN = EIP del ECS para que el
    #  navegador lo asocie a la IP. (Self-signed -> aviso la 1a vez; al aceptar,
    #  https:// = contexto seguro y el microfono funciona.)
    - name: Generar certificado self-signed para nginx
      command: >-
        openssl req -x509 -nodes -newkey rsa:2048
        -keyout {{ certs_dir }}/server.key
        -out {{ certs_dir }}/server.crt
        -days 825
        -subj "/CN=pronunciation-trainer"
        -addext "subjectAltName=IP:{{ app_public_ip }}"
      args:
        creates: "{{ certs_dir }}/server.crt"

    # ------------------------------------------------------- Artefactos
    - name: Generar archivo .env
      template:
        src: env.pronunciation.j2
        dest: "{{ install_dir }}/.env"
        mode: "0600"

    - name: Copiar docker-compose
      copy:
        src: docker-compose.pronunciation.yml
        dest: "{{ install_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Copiar config de nginx
      copy:
        src: nginx.default.conf
        dest: "{{ install_dir }}/nginx/default.conf"
        mode: "0644"

    # ------------------------------------------------------------ Desplegar
    - name: Pull de imagenes
      command: docker compose pull
      args:
        chdir: "{{ install_dir }}"

    - name: Levantar el stack
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ install_dir }}"

    - name: Esperar a que la app responda por HTTPS (nginx -> trainer)
      uri:
        url: https://127.0.0.1/
        validate_certs: false
        status_code: [200]
        timeout: 5
      register: app_ready
      retries: 60
      delay: 10
      until: app_ready.status is defined and app_ready.status == 200
      changed_when: false

    - name: Estado de los contenedores
      command: docker compose ps
      args:
        chdir: "{{ install_dir }}"
      register: compose_ps
      changed_when: false

    - name: Mostrar estado
      debug:
        var: compose_ps.stdout_lines

    - name: URL de acceso
      debug:
        msg:
          - "App (HTTPS directo al ECS): https://{{ app_public_ip }}"
          - "Cert self-signed: acepta el aviso del navegador una vez."
          - "CSV en OBS: {{ obs_bucket }}/{{ obs_csv_key }}. Editalo y reinicia el ECS para refrescarlo."
