all:

  vars:
    # En las imagenes Huawei el key pair se inyecta en root.
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3

    # Acceso SSH DIRECTO al ECS por su EIP (ya no hay bastion).
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null

  children:

    pronunciation:
      hosts:
        ecs-pronunciation:
          ansible_host: "{{ app_public_ip }}"
